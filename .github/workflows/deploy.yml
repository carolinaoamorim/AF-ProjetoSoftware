name: Deploy automatico (back)

on:
  push:
    branches: ["main"]
    paths: ["back/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

env:
  DOCKER_IMAGE: carolinaoamorim/avaliacao-af   # TROCAR na prova (tudo minúsculo)
  CONTAINER_NAME: avaliacao                     # TROCAR na prova
  DOCKER_USER: carolinaoamorim
  HOST_PORT: 8080                     # porta livre na EC2

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file back/pom.xml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./back
          file: ./back/Dockerfile
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_TEST }}
          username: ubuntu
          key: ${{ secrets.KEY_TEST }}
          port: 22
          script: |
            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm --force ${{ env.CONTAINER_NAME }} || true

            docker run -d \
              -p ${{ env.HOST_PORT }}:8080 \
              -e DB_HOST=${{ secrets.DB_HOST }} \
              --restart unless-stopped \
              --name ${{ env.CONTAINER_NAME }} \
              ${{ env.DOCKER_IMAGE }}:${{ github.sha }}